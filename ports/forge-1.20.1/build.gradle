// BeezzKeys for Minecraft 1.20.1 on Forge. The sources are generated from ../../src by ../gen.py; do not edit src/ here.
plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = project.mod_version + "+" + project.minecraft_version + "-forge"
group = "land.beezz"
base { archivesName = "beezzkeys" }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java.srcDirs = ["src/client/java"]
sourceSets.main.resources.srcDirs = ["src/client/resources", "src/main/resources"]

legacyForge {
    version = project.forge_version
    runs {
        // ./gradlew runSelftest: opens the keyboard, clicks through it, saves run/screenshots/beezzkeys_selftest_*.png,
        // closes the game; the log says "BeezzKeys selftest: OK"
        selftest {
            client()
            systemProperty 'beezzkeys.selftest', 'true'
        }
    }
    mods {
        beezzkeys { sourceSet sourceSets.main }
    }
}

mixin {
    add sourceSets.main, "beezzkeys.refmap.json"
    config "beezzkeys.client.mixins.json"
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

jar {
    manifest.attributes("MixinConfigs": "beezzkeys.client.mixins.json")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") { expand "version": project.mod_version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
